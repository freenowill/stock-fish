services:
  # StockFish - A 股分析 + 推演编排
  stockfish:
    image: zhuhai123/stockfish-stockfish:latest
    container_name: stockfish
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mirofish:
        condition: service_started
    restart: unless-stopped
    networks:
      - stockfish-net

  # MiroFish - 群体智能模拟引擎
  mirofish:
    image: zhuhai123/stockfish-mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - mirofish-uploads:/app/backend/uploads
    networks:
      - stockfish-net

networks:
  stockfish-net:
    driver: bridge

volumes:
  mirofish-uploads:
